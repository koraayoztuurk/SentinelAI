# SentinelAI production/staging edge (ES-068).
#
# Replaces the dev server block baked into the frontend image
# (frontend/nginx.conf) when the staging/production overlay is used, adding what
# a public deployment needs and local development does not: TLS termination,
# security response headers, transport-level flood protection and per-surface
# timeouts. The SPA-serving and same-origin reverse-proxy behaviour is
# unchanged, so the browser still talks to a single origin (no CORS).
#
# Mounted at /etc/nginx/conf.d/default.conf; certificates are mounted read-only
# at /etc/nginx/tls (see infrastructure/README.md).

# Transport-level protection against anonymous request floods — the half of
# traffic protection the application cannot do (api-design §13, ES-068): the
# backend limits authenticated identities, the edge limits everything that
# never gets that far. Keyed by client address, sized for many clients.
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# Do not advertise the server version in responses or error pages.
server_tokens off;

# The proxied API answers are JSON; the SPA bundle is pre-compressed poorly by
# nothing at all, so compress both. Never compress below the BREACH-relevant
# threshold trade-off default.
gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 1024;

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    server_name _;

    # Kept on HTTP so an unhealthy TLS configuration cannot hide the container's
    # health from the orchestrator.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ---- HTTPS: the served origin ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to every response this server produces
    # (`always`, so error responses carry them too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The SPA loads only its own bundle and calls only its own origin. Styles
    # need 'unsafe-inline' because the bundler injects them.
    add_header Content-Security-Policy
        "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # A single evidence payload is bounded at the API boundary
    # (EVIDENCE_PAYLOAD_MAX_BYTES, ADR-015); the edge refuses anything larger
    # before it is buffered, so the bound must not be *smaller* than the app's.
    client_max_body_size 10m;
    client_body_timeout 60s;

    # Vite emits content-hashed assets: the platform's only cacheable surface
    # (api-design §13 — everything the backend serves is declared no-store).
    #
    # `expires` rather than `add_header Cache-Control`: nginx inherits
    # `add_header` from an outer level only while the current level declares
    # none, so adding one header here would silently drop every security header
    # above for asset responses. `expires` emits the same max-age without
    # touching that inheritance (it costs only the `immutable` hint).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The investigation run surface drives the Investigation Loop: several
    # sequential provider calls, each with its own bound (the NVIDIA adapter
    # alone allows 180s, ADR-013 §1). Its read timeout is therefore an order of
    # magnitude larger than the rest of the API's — a shared short timeout
    # would sever a run that the backend is still legitimately executing.
    location ~ ^/api/v1/investigations/[^/]+/run$ {
        limit_req zone=api_edge burst=10 nodelay;
        limit_conn api_conn 20;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/ {
        limit_req zone=api_edge burst=40 nodelay;
        limit_conn api_conn 20;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # The operational surfaces are not public: metrics and readiness describe
    # the deployment, not the product, and a scraper or an orchestrator reaches
    # the backend directly on the internal network rather than through here.
    location /metrics {
        return 404;
    }

    location = /health/ready {
        return 404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
