# Continuous Integration (ES-030, extended by ES-068).
#
# Realizes the Release Readiness / Release Validation stages (release-management
# §5/§8): every change validates each deployment unit independently, and the
# deployment artifacts (images) are built, scanned, described by an SBOM and —
# on `main` and version tags — published to the registry as signed, versioned
# images (ES-068). Deploying them to an environment is a release-ops concern
# (promotion policy, Milestone H); this pipeline delivers the artifact, not the
# promotion.
#
# Registry: ghcr.io/<owner>/sentinelai-{backend,frontend} — see
# infrastructure/README.md for the tagging scheme and how a consumer verifies a
# signature.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend (validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ES-030 TD: reuse the wheel downloads across runs.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy strict)
        run: mypy app
      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=html
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov

  backend-live:
    name: Backend (live persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: ci_only_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ES-030 TD: reuse the wheel downloads across runs.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Live persistence tests (opt-in marker)
        run: pytest -m live

  backend-live-neo4j:
    name: Backend (live graph store)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci_only_password
        ports:
          - "7687:7687"
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci_only_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ES-030 TD: reuse the wheel downloads across runs.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Live graph-store tests (opt-in marker)
        run: pytest -m live_neo4j

  backend-live-qdrant:
    name: Backend (live vector store)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant
        ports:
          - "6333:6333"
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: ci_only_password
      QDRANT_URL: http://127.0.0.1:6333
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ES-030 TD: reuse the wheel downloads across runs.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/readyz && break
            sleep 1
          done
      - name: Live vector-store tests (opt-in marker)
        run: pytest -m live_qdrant

  frontend:
    name: Frontend (validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test (+ coverage)
        run: npm run test:coverage
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Build
        run: npm run build

  compose:
    name: Deployment overlays (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The staging/production overlays carry the deployment hardening
      # (TLS edge, least privilege, resource and log bounds, ES-068). A merge
      # error in them only shows up at deploy time otherwise.
      - name: Validate base and environment overlays
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml \
            --profile data config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile data config -q
      - name: Assert the production overlay hardens the deployment
        run: |
          set -euo pipefail
          config=$(docker compose -f docker-compose.yml \
            -f docker-compose.prod.yml --profile data config)
          echo "$config" | grep -q "no-new-privileges:true"
          echo "$config" | grep -q "read_only: true"
          echo "$config" | grep -q "RATE_LIMIT_ENABLED"
          echo "$config" | grep -q "/etc/nginx/tls"
          # The dev host mapping must not survive into production.
          test "$(echo "$config" | grep -c 'published: "8080"')" -eq 0

  images:
    name: Image (${{ matrix.unit }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing via the GitHub OIDC provider
    strategy:
      fail-fast: false
      matrix:
        unit: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: steps.decision.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versioned tags (ES-030 TD: "no versioned image pipeline"): a semver tag
      # publishes {major}.{minor}.{patch} and {major}.{minor}, every build
      # publishes its commit sha, and `main` moves `latest`.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sentinelai-${{ matrix.unit }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # The published frontend image is built without VITE_API_BASE_URL on
      # purpose: the SPA then calls its own origin and nginx proxies it, so one
      # artifact runs behind any hostname (closing the ES-028 build-time
      # base-URL coupling for published images).
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.unit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ steps.decision.outputs.publish == 'true' }}
          load: ${{ steps.decision.outputs.publish != 'true' }}
          # Attestations require the registry exporter, so they ride with the
          # publish: an SBOM and max-mode provenance travel *with* the image
          # rather than living only in this run's artifacts.
          sbom: ${{ steps.decision.outputs.publish == 'true' }}
          provenance: ${{ steps.decision.outputs.publish == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}

      - name: Resolve the scanned reference
        id: ref
        run: |
          echo "image=$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)" \
            >> "$GITHUB_OUTPUT"

      # Report everything, gate on what we can actually act on: an unfixed
      # upstream base-image CVE is triaged (documented posture), a fixable
      # HIGH/CRITICAL is a build failure.
      - name: Vulnerability report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: json
          output: trivy-${{ matrix.unit }}.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Vulnerability gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom-${{ matrix.unit }}.spdx.json
          artifact-name: sbom-${{ matrix.unit }}.spdx.json

      - name: Publish scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.unit }}
          path: trivy-${{ matrix.unit }}.json
          if-no-files-found: ignore

      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so a consumer can verify *which pipeline* produced the image
      # without the project holding a signing key.
      - name: Install cosign
        if: steps.decision.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        if: steps.decision.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sentinelai-${{ matrix.unit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
